server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/api/v1/auth/**

        - id: project-service
          uri: http://project-service:8082
          predicates:
            - Path=/api/v1/projects/**

        - id: ai-service
          uri: http://ai-service:8083
          predicates:
            - Path=/api/v1/ai/**
