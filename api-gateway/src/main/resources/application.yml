server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_BASE_URL:http://auth-service:8081}
          predicates:
            - Path=/api/v1/auth/**

        - id: project-service
          uri: ${PROJECT_SERVICE_BASE_URL:http://project-service:8082}
          predicates:
            - Path=/api/v1/projects/**

        - id: ai-service
          uri: ${AI_SERVICE_BASE_URL:http://ai-service:8083}
          predicates:
            - Path=/api/v1/ai/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true