# Server Configuration
server.port=${PORT:8083}
spring.application.name=ai-service

# RabbitMQ Configuration
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}

# Point to your API key variable
langchain4j.open-ai.chat-model.base-url=https://generativelanguage.googleapis.com/v1beta/openai/
langchain4j.open-ai.chat-model.model-name=${AI_MODEL:gemini-3.6-flash}

spring.rabbitmq.listener.simple.default-requeue-rejected=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
