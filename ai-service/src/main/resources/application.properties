# Server Configuration
server.port=8083
spring.application.name=ai-service

# RabbitMQ Configuration
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Point to your API key variable
langchain4j.open-ai.chat-model.base-url=https://generativelanguage.googleapis.com/v1beta/openai/
langchain4j.open-ai.chat-model.model-name=${AI_MODEL:gemini-3.6-flash}

spring.rabbitmq.listener.simple.default-requeue-rejected=false
