services:
  - type: web
    name: prototype-frontend
    runtime: static
    
    buildCommand: cd frontend && npm install && npm run build 
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

  - type: web
    name: prototype-api-gateway
    runtime: docker
    plan: free
    dockerfilePath: ./api-gateway/Dockerfile
    dockerContext: ./api-gateway
    healthCheckPath: /actuator/health
    envVars:
      - key: AUTH_SERVICE_BASE_URL
        sync: false
      - key: PROJECT_SERVICE_BASE_URL
        sync: false
      - key: AI_SERVICE_BASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGIN
        sync: false

  - type: web
    name: prototype-auth-service
    runtime: docker
    plan: free
    dockerfilePath: ./auth-service/Dockerfile
    dockerContext: ./auth-service
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: prototype-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: prototype-project-service
    runtime: docker
    plan: free
    dockerfilePath: ./project-service/Dockerfile
    dockerContext: ./project-service
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: prototype-db
          property: connectionString
      - key: PROTOTYPE_GENERATION_MODE
        value: sync
      - key: RABBIT_HEALTH_ENABLED
        value: false
      - key: AI_SERVICE_BASE_URL
        sync: false

  - type: web
    name: prototype-ai-service
    runtime: docker
    plan: free
    dockerfilePath: ./ai-service/Dockerfile
    dockerContext: ./ai-service
    healthCheckPath: /actuator/health
    envVars:
      - key: PROTOTYPE_GENERATION_MODE
        value: sync
      - key: RABBIT_HEALTH_ENABLED
        value: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-3.6-flash
